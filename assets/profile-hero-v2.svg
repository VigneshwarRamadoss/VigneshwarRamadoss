<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Vigneshwar Ramadoss — Technical Founder and Product Engineer</title>
  <desc id="desc">A restrained dark technical profile hero showing Vigneshwar Ramadoss and a four-stage problem, system, build, ship workflow.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8b949e" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="nameClip">
      <rect class="name-mask" x="62" y="92" width="0" height="84"/>
    </clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .hero { opacity: 0; transform: translateY(5px); animation: heroIn .45s ease-out .05s forwards; }
      .name-mask { animation: revealName .7s cubic-bezier(.22,.75,.25,1) .34s forwards; }
      .role, .role-rule { opacity: 0; animation: fadeUp .45s ease-out .86s forwards; }
      .role-rule { transform-origin: 62px 210px; transform: scaleX(0); animation-name: drawRole; }
      .statement { opacity: 0; animation: fadeUp .5s ease-out 1.18s forwards; }
      .meta { opacity: 0; animation: fadeUp .45s ease-out 1.46s forwards; }
      .flow-base { opacity: 0; animation: fadeIn .35s ease-out 1.35s forwards; }
      .flow-line { stroke-dasharray: 116; stroke-dashoffset: 116; animation: drawLine .42s ease-out forwards; }
      .l1 { animation-delay: 1.58s; } .l2 { animation-delay: 1.98s; } .l3 { animation-delay: 2.38s; }
      .node { opacity: 0; transform-box: fill-box; transform-origin: center; animation: nodeIn .34s ease-out forwards; }
      .n1 { animation-delay: 1.42s; } .n2 { animation-delay: 1.82s; } .n3 { animation-delay: 2.22s; } .n4 { animation-delay: 2.62s; }
      .status { opacity: 0; animation: fadeIn .35s ease-out 2.88s forwards; }
      .pulse { opacity: 0; animation: pulseOnce 1.1s ease-out 3.02s forwards; }

      @keyframes heroIn { to { opacity: 1; transform: translateY(0); } }
      @keyframes revealName { to { width: 900px; } }
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drawRole { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
      @keyframes drawLine { to { stroke-dashoffset: 0; } }
      @keyframes nodeIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
      @keyframes pulseOnce { 0% { opacity: 0; r: 3; } 30% { opacity: .5; r: 9; } 100% { opacity: 0; r: 14; } }

      @media (prefers-reduced-motion: reduce) {
        .hero, .name-mask, .role, .role-rule, .statement, .meta, .flow-base, .flow-line, .node, .status, .pulse {
          animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important;
        }
        .name-mask { width: 900px; }
        .pulse { opacity: 0 !important; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="15.5" fill="none" stroke="#30363d"/>
  <rect x="620" y="1" width="579" height="418" rx="15" fill="url(#grid)"/>
  <rect x="520" y="1" width="420" height="418" fill="url(#fadeGrid)"/>

  <g class="hero">
    <g class="sans" clip-path="url(#nameClip)">
      <text x="62" y="151" fill="#f0f6fc" font-size="66" font-weight="650" letter-spacing="-2.7">Vigneshwar Ramadoss</text>
    </g>

    <g class="role sans">
      <text x="62" y="210" fill="#8b949e" font-size="14" font-weight="650" letter-spacing="2.25">TECHNICAL FOUNDER</text>
      <text x="259" y="210" fill="#484f58" font-size="14">/</text>
      <text x="281" y="210" fill="#c9d1d9" font-size="14" font-weight="650" letter-spacing="2.25">PRODUCT ENGINEER</text>
    </g>
    <line class="role-rule" x1="62" y1="229" x2="510" y2="229" stroke="#30363d"/>

    <text class="statement sans" x="62" y="272" fill="#c9d1d9" font-size="20" font-weight="430">
      <tspan x="62" dy="0">Building intelligent products across software,</tspan>
      <tspan x="62" dy="31">AI and product design.</tspan>
    </text>

    <g class="meta mono" font-size="11.5" letter-spacing="1.2">
      <text x="62" y="361" fill="#8b949e">CO-FOUNDER</text>
      <text x="155" y="361" fill="#58a6ff">THE DOT</text>
      <circle cx="233" cy="357" r="1.8" fill="#484f58"/>
      <text x="247" y="361" fill="#8b949e">INDIA</text>
      <circle cx="302" cy="357" r="1.8" fill="#484f58"/>
      <text x="316" y="361" fill="#8b949e">BUILDING · SHIPPING · LEARNING</text>
    </g>

    <g class="flow-base">
      <text class="mono" x="704" y="70" fill="#484f58" font-size="11" letter-spacing="1.8">PRODUCT SYSTEM / 01</text>
      <text class="mono" x="1080" y="70" fill="#484f58" font-size="11" text-anchor="end">2026</text>
      <line x1="704" y1="87" x2="1080" y2="87" stroke="#21262d"/>

      <line class="flow-line l1" x1="758" y1="208" x2="874" y2="208" stroke="#484f58"/>
      <line class="flow-line l2" x1="874" y1="208" x2="990" y2="208" stroke="#484f58"/>
      <line class="flow-line l3" x1="990" y1="208" x2="1106" y2="208" stroke="#484f58"/>

      <g class="node n1">
        <circle cx="736" cy="208" r="21" fill="#0d1117" stroke="#30363d"/>
        <circle cx="736" cy="208" r="4" fill="#8b949e"/>
        <text class="mono" x="736" y="253" fill="#484f58" font-size="10" text-anchor="middle">01</text>
        <text class="mono" x="736" y="273" fill="#8b949e" font-size="11" letter-spacing="1.5" text-anchor="middle">PROBLEM</text>
      </g>
      <g class="node n2">
        <circle cx="874" cy="208" r="21" fill="#0d1117" stroke="#30363d"/>
        <circle cx="874" cy="208" r="4" fill="#8b949e"/>
        <text class="mono" x="874" y="253" fill="#484f58" font-size="10" text-anchor="middle">02</text>
        <text class="mono" x="874" y="273" fill="#8b949e" font-size="11" letter-spacing="1.5" text-anchor="middle">SYSTEM</text>
      </g>
      <g class="node n3">
        <circle cx="1012" cy="208" r="21" fill="#0d1117" stroke="#58a6ff" stroke-opacity=".72"/>
        <circle cx="1012" cy="208" r="4" fill="#58a6ff"/>
        <circle class="pulse" cx="1012" cy="208" r="3" fill="none" stroke="#58a6ff"/>
        <text class="mono" x="1012" y="253" fill="#58a6ff" font-size="10" text-anchor="middle">03</text>
        <text class="mono" x="1012" y="273" fill="#c9d1d9" font-size="11" letter-spacing="1.5" text-anchor="middle">BUILD</text>
      </g>
      <g class="node n4">
        <circle cx="1128" cy="208" r="21" fill="#0d1117" stroke="#30363d"/>
        <circle cx="1128" cy="208" r="4" fill="#8b949e"/>
        <text class="mono" x="1128" y="253" fill="#484f58" font-size="10" text-anchor="middle">04</text>
        <text class="mono" x="1128" y="273" fill="#8b949e" font-size="11" letter-spacing="1.5" text-anchor="middle">SHIP</text>
      </g>

      <g class="status mono" font-size="10.5" letter-spacing="1.2">
        <rect x="704" y="326" width="376" height="36" rx="5" fill="#0d1117" stroke="#21262d"/>
        <circle cx="724" cy="344" r="3" fill="#3fb950"/>
        <text x="738" y="348" fill="#8b949e">STATUS</text>
        <text x="797" y="348" fill="#c9d1d9">BUILDING</text>
        <text x="1058" y="348" fill="#484f58" text-anchor="end">SYS / ACTIVE</text>
      </g>
    </g>
  </g>
</svg>

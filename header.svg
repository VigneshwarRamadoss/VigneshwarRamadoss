<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Vigneshwar Ramadoss — Co-Founder @ The Dot</title>
  <desc id="desc">Technical Founder profile hero displaying Vigneshwar Ramadoss, Co-Founder @ The Dot, and the Problem to System to Build to Ship workflow.</desc>

  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f6fc" stroke-opacity="0.03" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="#f0f6fc" fill-opacity="0.05"/>
    </pattern>
    
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      
      .fade-up { opacity: 0; animation: fUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .fade-in { opacity: 0; animation: fIn 1.2s ease-out forwards; }
      .line-draw { stroke-dasharray: 200; stroke-dashoffset: 200; animation: drawL 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .pulse { opacity: 0; animation: pNode 3s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 4 12; stroke-dashoffset: 0; animation: stream 15s linear infinite; }
      
      .d-1 { animation-delay: 0.1s; }
      .d-2 { animation-delay: 0.2s; }
      .d-3 { animation-delay: 0.4s; }
      .d-4 { animation-delay: 0.6s; }
      .d-5 { animation-delay: 0.8s; }
      
      @keyframes fUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fIn { to { opacity: 1; } }
      @keyframes drawL { to { stroke-dashoffset: 0; } }
      @keyframes pNode { 0%, 100% { opacity: 0.4; stroke-width: 1; } 50% { opacity: 1; stroke-width: 1.5; } }
      @keyframes stream { to { stroke-dashoffset: -200; } }
      
      @media (prefers-reduced-motion: reduce) {
        .fade-up, .fade-in, .line-draw, .pulse, .data-stream { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
      }
    </style>
  </defs>

  <!-- Base layer -->
  <rect width="1200" height="380" fill="#0d1117"/>
  
  <!-- Right-side Grid & Glow -->
  <rect x="500" y="0" width="700" height="380" fill="url(#grid)"/>
  <rect x="500" y="0" width="700" height="380" fill="url(#gridFade)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
  
  <!-- Faint Border -->
  <rect x="1" y="1" width="1198" height="378" rx="12" fill="none" stroke="#f0f6fc" stroke-opacity="0.04"/>

  <!-- ==========================================
       LEFT SIDE: IDENTITY (55%)
       ========================================== -->
       
  <!-- Metadata Top -->
  <g class="mono fade-in d-1" font-size="11" letter-spacing="2">
    <text x="80" y="64" fill="#7d8590">ID /</text>
    <text x="120" y="64" fill="#c9d1d9">VIGNESHWAR_RAMADOSS</text>
  </g>

  <g class="fade-up d-1">
    <!-- Name -->
    <text class="sans" x="80" y="126" fill="#f0f6fc" font-size="52" font-weight="600" letter-spacing="-1.2">Vigneshwar Ramadoss</text>
    
    <!-- Role -->
    <text class="mono" x="80" y="166" fill="#58a6ff" font-size="12" font-weight="600" letter-spacing="1.5">CO-FOUNDER @ THE DOT</text>

    <!-- Positioning -->
    <text class="sans" x="80" y="222" fill="#f0f6fc" font-size="18" font-weight="400" letter-spacing="-0.1">
      <tspan x="80" dy="0">Turning business problems into products, systems</tspan>
      <tspan x="80" dy="28" fill="#c9d1d9">and high-performance digital experiences.</tspan>
    </text>

    <!-- Focus -->
    <g class="mono" font-size="11.5" letter-spacing="1.2">
      <text x="80" y="294" fill="#7d8590">FOCUS /</text>
      <text x="144" y="294" fill="#c9d1d9">PRODUCT DEV</text>
      <text x="240" y="294" fill="#7d8590">·</text>
      <text x="256" y="294" fill="#c9d1d9">DIGITAL TRANSFORMATION</text>
      <text x="448" y="294" fill="#7d8590">·</text>
      <text x="464" y="294" fill="#c9d1d9">APPLIED AI</text>
    </g>
  </g>

  <!-- Status Bottom -->
  <g class="mono fade-in d-2" font-size="11" letter-spacing="1.5">
    <circle cx="84" cy="344" r="3.5" fill="#58a6ff"/>
    <circle class="pulse d-2" cx="84" cy="344" r="5" fill="none" stroke="#58a6ff"/>
    <text x="100" y="348" fill="#7d8590">STATUS:</text>
    <text x="160" y="348" fill="#f0f6fc" font-weight="600">SYSTEM ONLINE</text>
  </g>


  <!-- ==========================================
       RIGHT SIDE: SYSTEM VISUALIZATION (45%)
       ========================================== -->
       
  <g class="fade-up d-3" transform="translate(850, 0)">
    
    <!-- Metadata Top Right -->
    <g class="mono" font-size="11" letter-spacing="2" text-anchor="middle">
      <text x="50" y="64" fill="#7d8590">SYSTEM ARCHITECTURE</text>
    </g>

    <!-- Vertical Lines -->
    <g fill="none" stroke="#30363d" stroke-width="1.5">
      <path class="line-draw d-3" d="M 50 118 L 50 152"/>
      <path class="line-draw d-4" d="M 50 178 L 50 212"/>
      <path class="line-draw d-5" d="M 50 238 L 50 272"/>
    </g>
    
    <!-- Animated Data Flow -->
    <path class="data-stream" d="M 50 100 L 50 300" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- 01 PROBLEM -->
    <g transform="translate(50, 106)">
      <!-- Box/Node container -->
      <rect x="-80" y="-12" width="160" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <g class="mono" font-size="11" letter-spacing="1.5" text-anchor="middle">
        <text x="-32" y="4" fill="#7d8590">01</text>
        <text x="16" y="4" fill="#c9d1d9" font-weight="600">PROBLEM</text>
      </g>
    </g>

    <!-- Down Arrow 1 -->
    <path class="fade-in d-4" d="M 46 148 L 50 153 L 54 148" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 02 SYSTEM -->
    <g transform="translate(50, 166)">
      <rect x="-80" y="-12" width="160" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <g class="mono" font-size="11" letter-spacing="1.5" text-anchor="middle">
        <text x="-32" y="4" fill="#7d8590">02</text>
        <text x="16" y="4" fill="#c9d1d9" font-weight="600">SYSTEM</text>
      </g>
    </g>

    <!-- Down Arrow 2 -->
    <path class="fade-in d-5" d="M 46 208 L 50 213 L 54 208" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 03 BUILD (Active) -->
    <g transform="translate(50, 226)">
      <!-- Active Glow -->
      <rect x="-80" y="-12" width="160" height="24" rx="4" fill="#58a6ff" fill-opacity="0.08"/>
      <rect x="-80" y="-12" width="160" height="24" rx="4" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
      <g class="mono" font-size="11" letter-spacing="1.5" text-anchor="middle">
        <text x="-32" y="4" fill="#58a6ff">03</text>
        <text x="16" y="4" fill="#f0f6fc" font-weight="700">BUILD</text>
      </g>
      <!-- Pulse dot indicator on the side -->
      <circle cx="-68" cy="0" r="3" fill="#58a6ff"/>
      <circle class="pulse d-5" cx="-68" cy="0" r="4.5" fill="none" stroke="#58a6ff"/>
    </g>

    <!-- Down Arrow 3 -->
    <path class="fade-in d-5" d="M 46 268 L 50 273 L 54 268" fill="none" stroke="#7d8590" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 04 SHIP -->
    <g transform="translate(50, 286)">
      <rect x="-80" y="-12" width="160" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <g class="mono" font-size="11" letter-spacing="1.5" text-anchor="middle">
        <text x="-32" y="4" fill="#7d8590">04</text>
        <text x="16" y="4" fill="#c9d1d9" font-weight="600">SHIP</text>
      </g>
    </g>

  </g>
  
</svg>
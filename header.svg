<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Vigneshwar Ramadoss — Co-Founder @ The Dot</title>
  <desc id="desc">Technical Founder profile hero displaying Vigneshwar Ramadoss, Co-Founder @ The Dot, and the Problem to System to Build to Ship workflow.</desc>

  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f6fc" stroke-opacity="0.02" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="#f0f6fc" fill-opacity="0.05"/>
    </pattern>

    <!-- Fades and Glows -->
    <radialGradient id="glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.3" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>

    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      
      /* Restrained animations */
      .fade-up { opacity: 0; animation: fUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .fade-in { opacity: 0; animation: fIn 1.2s ease-out forwards; }
      .line-draw { stroke-dasharray: 400; stroke-dashoffset: 400; animation: drawL 2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .pulse { opacity: 0; animation: pNode 3s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 4 12; stroke-dashoffset: 0; animation: stream 15s linear infinite; }
      
      .d-1 { animation-delay: 0.1s; }
      .d-2 { animation-delay: 0.2s; }
      .d-3 { animation-delay: 0.4s; }
      .d-4 { animation-delay: 0.6s; }
      .d-5 { animation-delay: 0.8s; }
      
      @keyframes fUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fIn { to { opacity: 1; } }
      @keyframes drawL { to { stroke-dashoffset: 0; } }
      @keyframes pNode { 0%, 100% { r: 3; opacity: 0.3; stroke-width: 1; } 50% { r: 8; opacity: 1; stroke-width: 1.5; } }
      @keyframes stream { to { stroke-dashoffset: -400; } }
      
      @media (prefers-reduced-motion: reduce) {
        .fade-up, .fade-in, .line-draw, .pulse, .data-stream { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
      }
    </style>
  </defs>

  <!-- Base layer -->
  <rect width="1200" height="380" fill="#0d1117"/>
  
  <!-- Subtle Glow & Grid -->
  <rect width="1200" height="380" fill="url(#glow)"/>
  <rect x="400" y="0" width="800" height="380" fill="url(#grid)"/>
  <rect x="400" y="0" width="800" height="380" fill="url(#gridFade)"/>
  
  <!-- Faint Border (Apple/Linear restraint) -->
  <rect x="1" y="1" width="1198" height="378" rx="12" fill="none" stroke="#f0f6fc" stroke-opacity="0.04"/>

  <!-- Top-left microcopy -->
  <g class="mono fade-in d-1" font-size="10" letter-spacing="2">
    <text x="64" y="56" fill="#7d8590">ID /</text>
    <text x="96" y="56" fill="#f0f6fc">VIGNESHWAR_RAMADOSS</text>
  </g>

  <!-- Left Identity Block -->
  <g class="fade-up d-1">
    <text class="sans" x="64" y="150" fill="#f0f6fc" font-size="46" font-weight="600" letter-spacing="-1.2">Vigneshwar Ramadoss</text>
    
    <!-- Role & Company -->
    <g class="mono" font-size="12" letter-spacing="1.5">
      <text x="64" y="188" fill="#58a6ff">CO-FOUNDER — THE DOT</text>
      <text x="248" y="188" fill="#484f58">//</text>
      <text x="274" y="188" fill="#7d8590">TECHNICAL FOUNDER</text>
    </g>

    <!-- Positioning Statement -->
    <text class="sans" x="64" y="244" fill="#c9d1d9" font-size="17" font-weight="400" letter-spacing="-0.1">
      <tspan x="64" dy="0">Turning business problems into products, systems</tspan>
      <tspan x="64" dy="26">and high-performance digital experiences.</tspan>
    </text>

    <!-- Focus areas quietly integrated -->
    <g class="mono" font-size="11" letter-spacing="1.2">
      <text x="64" y="306" fill="#484f58">FOCUS /</text>
      <text x="124" y="306" fill="#7d8590">PRODUCT DEV</text>
      <text x="216" y="306" fill="#484f58">·</text>
      <text x="230" y="306" fill="#7d8590">DIGITAL TRANSFORMATION</text>
      <text x="408" y="306" fill="#484f58">·</text>
      <text x="422" y="306" fill="#7d8590">APPLIED AI</text>
    </g>
  </g>

  <!-- Bottom-left Status -->
  <g class="mono fade-in d-2" font-size="10" letter-spacing="1.5">
    <circle cx="68" cy="350" r="3" fill="#58a6ff"/>
    <circle class="pulse d-2" cx="68" cy="350" r="3" fill="none" stroke="#58a6ff"/>
    <text x="82" y="353" fill="#484f58">STATUS:</text>
    <text x="136" y="353" fill="#f0f6fc">SYSTEM ONLINE</text>
  </g>

  <!-- RIGHT SIDE: Architectural System Diagram -->
  <g class="fade-up d-3" transform="translate(680, 0)">
    
    <!-- Top-right microcopy -->
    <g class="mono" font-size="10" letter-spacing="2" text-anchor="end">
      <text x="456" y="56" fill="#484f58">SYS_ARCH / 0.1</text>
    </g>

    <!-- Base Paths -->
    <g fill="none" stroke="#30363d" stroke-width="1.5" stroke-linejoin="round">
      <path class="line-draw d-3" d="M 40 140 L 80 140 L 120 180 L 160 180 L 280 180 L 320 180 L 360 220 L 400 220"/>
      <path class="line-draw d-4" stroke-opacity="0.4" d="M 40 220 L 80 220 L 120 180"/>
      <path class="line-draw d-5" stroke-opacity="0.4" d="M 280 180 L 320 180 L 360 140 L 440 140"/>
    </g>
    
    <!-- Streaming Data -->
    <path class="data-stream" d="M 40 140 L 80 140 L 120 180 L 160 180 L 280 180 L 320 180 L 360 220 L 400 220" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.4" stroke-linejoin="round"/>

    <!-- [01] PROBLEM -->
    <g transform="translate(40, 140)">
      <circle cx="0" cy="0" r="12" fill="#0d1117" stroke="#f0f6fc" stroke-opacity="0.1" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#7d8590"/>
      <g class="mono" font-size="10" letter-spacing="1.5" text-anchor="middle">
        <text x="0" y="-22" fill="#484f58">01</text>
        <text x="0" y="30" fill="#7d8590">PROBLEM</text>
      </g>
    </g>

    <!-- [02] SYSTEM -->
    <g transform="translate(160, 180)">
      <circle cx="0" cy="0" r="12" fill="#0d1117" stroke="#f0f6fc" stroke-opacity="0.1" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#7d8590"/>
      <g class="mono" font-size="10" letter-spacing="1.5" text-anchor="middle">
        <text x="0" y="-22" fill="#484f58">02</text>
        <text x="0" y="30" fill="#7d8590">SYSTEM</text>
      </g>
    </g>

    <!-- [03] BUILD (Active) -->
    <g transform="translate(280, 180)">
      <!-- Aura -->
      <circle cx="0" cy="0" r="24" fill="#58a6ff" fill-opacity="0.04"/>
      <circle cx="0" cy="0" r="16" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#58a6ff"/>
      <circle class="pulse d-4" cx="0" cy="0" r="4" fill="none" stroke="#58a6ff"/>
      <g class="mono" font-size="10" letter-spacing="1.5" text-anchor="middle">
        <text x="0" y="-26" fill="#58a6ff">03</text>
        <text x="0" y="34" fill="#f0f6fc" font-weight="600">BUILD</text>
      </g>
    </g>

    <!-- [04] SHIP -->
    <g transform="translate(400, 220)">
      <circle cx="0" cy="0" r="12" fill="#0d1117" stroke="#f0f6fc" stroke-opacity="0.1" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="#7d8590"/>
      <g class="mono" font-size="10" letter-spacing="1.5" text-anchor="middle">
        <text x="0" y="-22" fill="#484f58">04</text>
        <text x="0" y="30" fill="#7d8590">SHIP</text>
      </g>
    </g>

    <!-- Terminals/Ports -->
    <g class="mono fade-in d-5" font-size="9" fill="#484f58" letter-spacing="1">
      <text x="445" y="143">OP_A</text>
      <text x="10" y="223">IP_B</text>
    </g>
  </g>
  
</svg>
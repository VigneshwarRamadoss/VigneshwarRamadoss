name: Update Profile Art

# Refreshes contribution data, heatmap SVG, and info card SVG daily.
# Uses plain git and default GITHUB_TOKEN.

on:
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile-art.yml'

permissions:
  contents: write

concurrency:
  group: profile-art-refresh
  cancel-in-progress: true

jobs:
  refresh-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Scrape live contribution data
        env:
          GH_PROFILE_USER: VigneshwarRamadoss
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_contributions.py

      - name: Regenerate dynamic SVGs
        run: |
          python scripts/make_header.py header.svg
          python scripts/make_info_card.py data/contributions.json info-card.svg
          python scripts/render_heatmap_svg.py data/contributions.json contrib-heatmap.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json info-card.svg contrib-heatmap.svg header.svg
          if git diff --staged --quiet; then
            echo "No changes in generated assets. Skipping commit."
          else
            git commit -m "chore(profile): refresh contribution data [skip ci]"
            git push
          fi
